name: diag
on:
  push:
    branches: [diag]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android) LevPrayersWidget/1.0"
          for c in ירושלים קרני-שומרון עזה טבריה אילת קצרין רמת-הגולן; do
            code=$(curl -s -o p.html -w '%{http_code}' -A "$UA" "https://www.kipa.co.il/זמני-היום/$c/")
            echo "CITY $c -> $code bytes=$(wc -c < p.html) times=$(grep -oE '[0-9]{2}:[0-9]{2}' p.html | head -16 | tr '\n' ' ')"
          done
          curl -s -A "$UA" "https://www.kipa.co.il/זמני-היום/ירושלים/" -o j.html
          i=$(grep -b -o 'עלות השחר' j.html | head -1 | cut -d: -f1); echo "OFFSET $i"
          dd if=j.html bs=1 skip=$((i-600)) count=2600 2>/dev/null | tr '\n' ' ' | sed 's/^/SNIP /'
          echo
          curl -s https://www.kipa.co.il/robots.txt | sed 's/^/ROBOTS /' | head -30
