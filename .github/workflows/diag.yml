name: diag
on:
  push:
    branches: [diag]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android) LevPrayersWidget/1.0"
          for c in בית-שמש שדרות מעלה-אדומים נתיב-העשרה אשקלון ראשון-לציון בני-ברק xyzxyz; do
            r=$(curl -s -o p.html -w '%{http_code} %{redirect_url}' -A "$UA" "https://www.kipa.co.il/זמני-היום/$c/")
            h1=$(grep -o '<h1>[^<]*</h1>' p.html | head -1)
            echo "PLACE $c -> $(echo $r | python3 -c 'import sys,urllib.parse;print(urllib.parse.unquote(sys.stdin.read().strip()))') $h1 list=$(grep -c 'lz-list' p.html)"
          done
